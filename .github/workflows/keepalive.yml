name: box-keepalive

on:
  schedule:
    # Run every 10 minutes on off-peak minutes to avoid GitHub Actions queue spikes
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: box-keepalive
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Heartbeat / wake machine
        env:
          KEY: ${{ secrets.INSTABOX_API_KEY }}
          MID: m_agqvewnk3b3qhjidng5ktd2co4
        run: |
          set -euo pipefail
          echo "[$(date -u +%FT%TZ)] Sending heartbeat to InstaBox machine $MID..."
          BEAT=$(curl -sS -m 100 -X POST             -H "X-API-Key: $KEY" -H "Content-Type: application/json"             -d '{"cmd":"true"}'             "https://api.instabox.sh/v1/machines/$MID/exec" || echo '{"error":{"code":"curl_failed"}}')
          echo "beat result: $BEAT"
          if echo "$BEAT" | grep -q machine_not_running; then
            echo "Machine is suspended! Triggering POST /start..."
            curl -sS -m 60 -X POST               -H "X-API-Key: $KEY" -H "Idempotency-Key: wake-$GITHUB_RUN_ID"               "https://api.instabox.sh/v1/machines/$MID/start"
            echo "start accepted; waiting 20s for VM resume..."
            sleep 20
            V=$(curl -sS -m 100 -X POST -H "X-API-Key: $KEY" -H "Content-Type: application/json"               -d '{"cmd":"true"}' "https://api.instabox.sh/v1/machines/$MID/exec")
            echo "verify result: $V"
            if echo "$V" | grep -q machine_not_running; then
              echo "Failed to wake machine!"
              exit 1
            fi
            echo "Machine successfully woken up!"
          elif ! echo "$BEAT" | grep -q '"exitCode"'; then
            echo "unexpected beat response: $BEAT"
            exit 1
          else
            echo "Machine is healthy and running."
          fi

      - name: Daily self-commit (keep repo active)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%F)
          LAST=$(cat .last-beat 2>/dev/null || echo none)
          if [ "$TODAY" != "$LAST" ]; then
            echo "$TODAY" > .last-beat
            git config user.name "keepalive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .last-beat
            git commit -m "beat $TODAY"
            git push
          else
            echo "already committed today"
          fi
